name: Sync deploy branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git for branch commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build frontend & backend deploy branches
        run: |
          chmod +x scripts/sync-deploy-branches.sh
          ./scripts/sync-deploy-branches.sh
      - name: Push deploy branches
        run: |
          git push -f origin frontend backend lara-frontend lara-backend
